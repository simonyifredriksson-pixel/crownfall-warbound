<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crownfall: Warbound — Command Your Army</title>
<meta name="description" content="A 3D fantasy strategy RPG. Build a deck of soldiers, monsters and siege engines, forge your commander's armour, and take the field in real-time tactical battles where positioning, counters and timing decide the war.">
<meta name="theme-color" content="#0b0c10">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Spectral:ital,wght@0,400;0,600;1,400&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/main.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='5' fill='%230b0c10'/><path d='M6 22 L9 11 L13 17 L16 9 L19 17 L23 11 L26 22 Z' fill='%23d9a441'/><rect x='6' y='23' width='20' height='3' fill='%23b9842c'/></svg>">
</head>
<body>

<canvas id="view"></canvas>
<div id="fx-layer"></div>
<div id="ui"></div>
<div id="toasts"></div>
<div id="tooltip" class="tip hidden"></div>

<div id="boot">
  <div class="boot-inner">
    <div class="boot-crown">
      <svg viewBox="0 0 120 70" width="200" height="117" aria-hidden="true">
        <defs>
          <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffe9a8"/><stop offset="0.5" stop-color="#d9a441"/><stop offset="1" stop-color="#8a5f18"/>
          </linearGradient>
        </defs>
        <path d="M10 56 L18 16 L34 38 L48 10 L62 38 L78 16 L86 56 Z" fill="url(%23bg1)" stroke="#5c3f10" stroke-width="1.5" transform="translate(12,0)"/>
        <rect x="22" y="56" width="76" height="8" rx="2" fill="url(%23bg1)" stroke="#5c3f10" stroke-width="1.5"/>
        <circle cx="60" cy="8" r="4" fill="#e8483a"/>
      </svg>
    </div>
    <h1 class="boot-title">CROWNFALL</h1>
    <div class="boot-tag">Every war is won before the first blade falls</div>
    <div class="boot-track"><div id="boot-bar"></div></div>
    <div id="boot-text">FORGING THE WORLD</div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
<noscript>
  <div style="position:fixed;inset:0;display:grid;place-items:center;background:#0b0c10;color:#e9e2d0;font-family:serif">
    Crownfall: Warbound needs JavaScript and WebGL.
  </div>
</noscript>
</body>
</html>
